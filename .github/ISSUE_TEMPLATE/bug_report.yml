name: Bug report
description: Report a reproducible product or platform defect.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before filing, remove credentials and sensitive case evidence from screenshots and logs.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: What happened, and which user workflow is affected?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Start...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    attributes:
      label: Version or commit
      placeholder: v1.3.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Environment
      options:
        - Local development
        - Production Compose
        - Hosted deployment
        - CI or test suite
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs
      description: Paste redacted logs, request IDs, or screenshots. Do not include secrets.
      render: shell
