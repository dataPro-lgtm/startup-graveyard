name: startup-graveyard

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-startup_graveyard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-startup_graveyard}
    volumes:
      - startup_graveyard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-startup_graveyard} -d ${POSTGRES_DB:-startup_graveyard}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    profiles: [demo]
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.seed
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    image: startup-graveyard-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SG_RUNTIME_ROLE: api
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OTEL_EXPORTER_PROMETHEUS_PORT: 9464
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RELEASE_VERSION: ${RELEASE_VERSION:-local}
      PORT: 18080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WEB_BASE_URL: ${WEB_BASE_URL:?WEB_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      RATE_LIMIT_AUTH_REFRESH_MAX: ${RATE_LIMIT_AUTH_REFRESH_MAX:-30}
      RATE_LIMIT_COPILOT_MAX: ${RATE_LIMIT_COPILOT_MAX:-20}
      RATE_LIMIT_EXPORT_MAX: ${RATE_LIMIT_EXPORT_MAX:-10}
      RATE_LIMIT_BILLING_MAX: ${RATE_LIMIT_BILLING_MAX:-10}
      RATE_LIMIT_WEBHOOK_MAX: ${RATE_LIMIT_WEBHOOK_MAX:-120}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_TEAM_PRICE_ID: ${STRIPE_TEAM_PRICE_ID:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_HOST: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_HOST:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_PORT: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_PORT:-587}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_SECURE: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_SECURE:-false}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_USER: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_USER:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_PASS: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_PASS:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_FROM: ${TEAM_WORKSPACE_RECOVERY_EMAIL_FROM:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_REPLY_TO: ${TEAM_WORKSPACE_RECOVERY_EMAIL_REPLY_TO:-}
      TEAM_WORKSPACE_RECOVERY_WEBHOOK_URL: ${TEAM_WORKSPACE_RECOVERY_WEBHOOK_URL:-}
      TEAM_WORKSPACE_RECOVERY_WEBHOOK_BEARER_TOKEN: ${TEAM_WORKSPACE_RECOVERY_WEBHOOK_BEARER_TOKEN:-}
      TEAM_WORKSPACE_RECOVERY_SLACK_WEBHOOK_URL: ${TEAM_WORKSPACE_RECOVERY_SLACK_WEBHOOK_URL:-}
      TEAM_WORKSPACE_RECOVERY_CRM_API_URL: ${TEAM_WORKSPACE_RECOVERY_CRM_API_URL:-}
      TEAM_WORKSPACE_RECOVERY_CRM_API_BEARER_TOKEN: ${TEAM_WORKSPACE_RECOVERY_CRM_API_BEARER_TOKEN:-}
      PLATFORM_ALERT_COOLDOWN_MINUTES: ${PLATFORM_ALERT_COOLDOWN_MINUTES:-60}
      PLATFORM_ALERT_RETRY_MINUTES: ${PLATFORM_ALERT_RETRY_MINUTES:-5}
      PLATFORM_ALERT_TIMEOUT_MS: ${PLATFORM_ALERT_TIMEOUT_MS:-10000}
      PLATFORM_ALERT_WEBHOOK_URL: ${PLATFORM_ALERT_WEBHOOK_URL:-}
      PLATFORM_ALERT_WEBHOOK_BEARER_TOKEN: ${PLATFORM_ALERT_WEBHOOK_BEARER_TOKEN:-}
      PLATFORM_ALERT_SLACK_WEBHOOK_URL: ${PLATFORM_ALERT_SLACK_WEBHOOK_URL:-}
    expose:
      - '9464'
    ports:
      - '${API_PORT:-18080}:18080'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: startup-graveyard-api:${IMAGE_TAG:-local}
    command: ['node', 'services/api/dist/workerProcess.js']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SG_RUNTIME_ROLE: worker
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OTEL_EXPORTER_PROMETHEUS_PORT: 9465
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RELEASE_VERSION: ${RELEASE_VERSION:-local}
      RUNTIME_HEALTH_PORT: 18081
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_HOST: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_HOST:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_PORT: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_PORT:-587}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_SECURE: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_SECURE:-false}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_USER: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_USER:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_PASS: ${TEAM_WORKSPACE_RECOVERY_EMAIL_SMTP_PASS:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_FROM: ${TEAM_WORKSPACE_RECOVERY_EMAIL_FROM:-}
      TEAM_WORKSPACE_RECOVERY_EMAIL_REPLY_TO: ${TEAM_WORKSPACE_RECOVERY_EMAIL_REPLY_TO:-}
      TEAM_WORKSPACE_RECOVERY_WEBHOOK_URL: ${TEAM_WORKSPACE_RECOVERY_WEBHOOK_URL:-}
      TEAM_WORKSPACE_RECOVERY_WEBHOOK_BEARER_TOKEN: ${TEAM_WORKSPACE_RECOVERY_WEBHOOK_BEARER_TOKEN:-}
      TEAM_WORKSPACE_RECOVERY_SLACK_WEBHOOK_URL: ${TEAM_WORKSPACE_RECOVERY_SLACK_WEBHOOK_URL:-}
      TEAM_WORKSPACE_RECOVERY_CRM_API_URL: ${TEAM_WORKSPACE_RECOVERY_CRM_API_URL:-}
      TEAM_WORKSPACE_RECOVERY_CRM_API_BEARER_TOKEN: ${TEAM_WORKSPACE_RECOVERY_CRM_API_BEARER_TOKEN:-}
      PLATFORM_ALERT_COOLDOWN_MINUTES: ${PLATFORM_ALERT_COOLDOWN_MINUTES:-60}
      PLATFORM_ALERT_RETRY_MINUTES: ${PLATFORM_ALERT_RETRY_MINUTES:-5}
      PLATFORM_ALERT_TIMEOUT_MS: ${PLATFORM_ALERT_TIMEOUT_MS:-10000}
      PLATFORM_ALERT_WEBHOOK_URL: ${PLATFORM_ALERT_WEBHOOK_URL:-}
      PLATFORM_ALERT_WEBHOOK_BEARER_TOKEN: ${PLATFORM_ALERT_WEBHOOK_BEARER_TOKEN:-}
      PLATFORM_ALERT_SLACK_WEBHOOK_URL: ${PLATFORM_ALERT_SLACK_WEBHOOK_URL:-}
    expose:
      - '9465'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:18081/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  scheduler:
    image: startup-graveyard-api:${IMAGE_TAG:-local}
    command: ['node', 'services/api/dist/schedulerProcess.js']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SG_RUNTIME_ROLE: scheduler
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-true}
      OTEL_EXPORTER_PROMETHEUS_PORT: 9466
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RELEASE_VERSION: ${RELEASE_VERSION:-local}
      RUNTIME_HEALTH_PORT: 18082
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    expose:
      - '9466'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:18082/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ops/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:18080}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3000}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:18080
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:18080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3000}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/startup-graveyard-alerts.yml:/etc/prometheus/startup-graveyard-alerts.yml:ro
      - startup_graveyard_prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      scheduler:
        condition: service_healthy

volumes:
  startup_graveyard_pg_data:
  startup_graveyard_prometheus_data:
